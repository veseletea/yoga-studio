services:
  backend:
    build: .
    container_name: yoga-backend
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/students"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: yoga-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: yoga-db
    environment:
      POSTGRES_DB: yogastudio
      POSTGRES_USER: yoga
      POSTGRES_PASSWORD: yoga_local_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U yoga -d yogastudio" ]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
