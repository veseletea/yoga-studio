spring.application.name=yoga-studio

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/yogastudio}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:yoga}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yoga_local_pass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- OpenAI ---
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.embedding.options.model=text-embedding-3-small

# --- pgvector ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536

# --- Admin seeding ---
app.admin.email=admin@yogastudio.local
app.admin.password=${ADMIN_PASSWORD:}

# spring.sql.init.mode=always


# --- App info (GET /api) ---
app.info.name=Yoga Studio Management
app.info.version=1.0
app.info.description=Backend API pentru gestionarea unui studio de yoga
app.info.live-since=2026

# --- Actuator ---
# Expunem doar health si info prin HTTP (restul raman inchise)
management.endpoints.web.exposure.include=health,info
# Fara detalii interne (DB, disk etc.) in raspunsul public /actuator/health
management.endpoint.health.show-details=never
# Populeaza /actuator/info din proprietatile info.*
management.info.env.enabled=true
info.app.name=${app.info.name}
info.app.version=${app.info.version}
info.app.description=${app.info.description}
